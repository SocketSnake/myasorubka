version: '3.8'

services:

  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass "${REDIS_PASSWORD}" --maxmemory 64mb --maxmemory-policy allkeys-lru --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  submeat_bot:
    build: ./submeat_bot
    container_name: submeat_bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./submeat_bot:/app/bot
      - ./data/:/app/data
    depends_on:
      redis:
        condition: service_healthy

  mmyaso_bot:
    build: ./mmyaso_bot
    container_name: mmyaso_bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./mmyaso_bot:/app/bot
      - ./data:/app/data
      - ./submeat_bot/database:/app/bot/submeat_db
    depends_on:
      redis:
        condition: service_healthy



volumes:
  redis_data: